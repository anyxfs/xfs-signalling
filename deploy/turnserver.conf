# /etc/xfs/turnserver.conf — TURN host (README.md, "Deployment")
# Runs in the official image coturn/coturn:4.18.0 with host networking (deploy/turn-host.sh).
# Never the distribution package: before 4.9 a v4-mapped peer (::ffff:127.0.0.1) bypasses
# denied-peer-ip (CVE-2026-27624); before 4.10 one packet crashes ARM64 (CVE-2026-40613).
# UDP relay only: the client (webrtc-rs) path verified is turn: over UDP; TURNS/443 later.

listening-port=3478
listening-ip=<PRIVATE_IPV4>
listening-ip=<PUBLIC_IPV6>
# IPv4 sits behind the cloud's 1:1 NAT: without this the relay candidates are private
# addresses. The IPv6 address is on the interface itself and needs no mapping.
external-ip=<PUBLIC_IPV4>/<PRIVATE_IPV4>
relay-ip=<PRIVATE_IPV4>
relay-ip=<PUBLIC_IPV6>
min-port=49152
max-port=65535

# Time-limited credentials signed by the signalling service (04 §4.3).
# BOTH lines are needed: use-auth-secret alone leaves coturn unauthenticated.
lt-cred-mech
use-auth-secret
static-auth-secret=<same value as /etc/xfs/turn-secret>
realm=anyxfs.cn
# 4.17+: CLI and DTLS are off unless enabled (--cli, --dtls); no-cli / no-dtls are rejected.
no-tls
pidfile=/tmp/turnserver.pid
stale-nonce=600

# Never a proxy into private, loopback, link-local or multicast space; the cloud
# metadata service (Tencent 169.254.0.23) is in 169.254/16. All v4-mapped and NAT64
# forms are refused outright: no legitimate peer uses them.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::-::ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-multicast-peers
# Loopback peers are refused by default (and by denied-peer-ip above); RFC 3489 compatibility is off by default.
no-rfc5780
response-origin-only-with-rfc5780

# Per allocation 100 Mbit/s; bps-capacity ~80% of the host's bandwidth (0 = unlimited).
max-bps=12500000
bps-capacity=<0.8 x host bandwidth in bytes/s, or 0>
user-quota=4
total-quota=6000

# Connection-level events only; never peer addresses (04 §6.2). No verbose.
# stdout goes to journald through Docker's log driver.
log-file=stdout
fingerprint
