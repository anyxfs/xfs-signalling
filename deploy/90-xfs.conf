# /etc/sysctl.d/90-xfs.conf — connection floods are dropped by the kernel before
# they reach the process (04 §3.3.5 handles what gets through).
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 8192
net.core.somaxconn = 4096
net.ipv4.tcp_fin_timeout = 15
# coturn relays: larger UDP buffers (clients needed 4 MiB to keep relayed transfers from stalling)
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
